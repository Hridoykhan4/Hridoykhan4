<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="cpTitle cpDesc">
  <title id="cpTitle">What I Deliver — System Capabilities</title>
  <desc id="cpDesc">Secure authentication: JWT flows with Firebase Auth, OAuth 2.0 with Google and Facebook, role-based access control, server-side role validation. Payment systems: Stripe PaymentIntents in production, SSLCommerz for local payments, server-side price recalculation, webhook event handling. AI and automation: n8n workflow orchestration, LLM-powered autonomous agents including Hermes, API orchestration across services, business-process automation. Production architecture: REST API design and versioning, MongoDB indexing and aggregations, CI/CD with GitHub Actions, observability and recovery paths.</desc>

  <defs>
    <radialGradient id="cpGlowL" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cpGlowR" cx="100%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cpScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cpClip">
      <rect x="0" y="0" width="1400" height="640" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cpClip)">
    <rect x="0" y="0" width="1400" height="640" fill="#0D1117"/>
    <rect x="0" y="0" width="1400" height="640" fill="url(#cpGlowL)"/>
    <rect x="0" y="0" width="1400" height="640" fill="url(#cpGlowR)"/>

    <!-- header -->
    <circle cx="52" cy="46" r="4" fill="#00D9FF"/>
    <text x="72" y="52" font-family="'Cascadia Code','Consolas','SF Mono',Menlo,monospace" font-size="19" letter-spacing="4" fill="#00D9FF">WHAT I DELIVER // SYSTEM CAPABILITIES</text>
    <text x="1360" y="52" font-family="'Cascadia Code','Consolas','SF Mono',Menlo,monospace" font-size="13" letter-spacing="2" fill="#45536A" text-anchor="end">HRD·SYS // ENGINEERED FOR PRODUCTION</text>
    <line x1="40" y1="76" x2="1360" y2="76" stroke="#1C2536"/>

    <!-- ============ Q1 · SECURE AUTHENTICATION ============ -->
    <g>
      <rect x="40" y="100" width="644" height="246" rx="14" fill="#0C1322" stroke="#1C2536"/>
      <rect x="40" y="100" width="4" height="246" rx="2" fill="#00D9FF" fill-opacity="0.6"/>
      <g stroke="#00D9FF" stroke-width="2" fill="none" stroke-opacity="0.85">
        <rect x="80" y="140" width="30" height="22" rx="4"/>
        <path d="M 86 140 L 86 132 A 9 9 0 0 1 104 132 L 104 140"/>
        <circle cx="95" cy="151" r="3" fill="#00D9FF" stroke="none"/>
      </g>
      <text x="136" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#E8EDF5">Secure Authentication</text>
      <g font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="17" fill="#8B96A9">
        <circle cx="88" cy="200" r="3" fill="#00D9FF"/><text x="106" y="206">JWT auth flows + Firebase Auth</text>
        <circle cx="88" cy="236" r="3" fill="#00D9FF"/><text x="106" y="242">OAuth 2.0 · Google / Facebook</text>
        <circle cx="88" cy="272" r="3" fill="#00D9FF"/><text x="106" y="278">Role-Based Access Control (RBAC)</text>
        <circle cx="88" cy="308" r="3" fill="#00D9FF"/><text x="106" y="314">Roles validated server-side, never trusted from tokens</text>
      </g>
    </g>

    <!-- ============ Q2 · PAYMENT SYSTEMS ============ -->
    <g>
      <rect x="716" y="100" width="644" height="246" rx="14" fill="#0C1322" stroke="#1C2536"/>
      <rect x="716" y="100" width="4" height="246" rx="2" fill="#7C5CFF" fill-opacity="0.6"/>
      <g stroke="#7C5CFF" stroke-width="2" fill="none" stroke-opacity="0.85">
        <rect x="756" y="134" width="36" height="26" rx="4"/>
        <line x1="756" y1="143" x2="792" y2="143"/>
        <line x1="762" y1="153" x2="774" y2="153"/>
      </g>
      <text x="812" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#E8EDF5">Payment Systems</text>
      <g font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="17" fill="#8B96A9">
        <circle cx="764" cy="200" r="3" fill="#7C5CFF"/><text x="782" y="206">Stripe PaymentIntents — live in production</text>
        <circle cx="764" cy="236" r="3" fill="#7C5CFF"/><text x="782" y="242">SSLCommerz for local BD payments</text>
        <circle cx="764" cy="272" r="3" fill="#7C5CFF"/><text x="782" y="278">Prices recalculated server-side — tamper-proof</text>
        <circle cx="764" cy="308" r="3" fill="#7C5CFF"/><text x="782" y="314">Webhook event handling &amp; recovery</text>
      </g>
    </g>

    <!-- ============ Q3 · AI &amp; AUTOMATION ============ -->
    <g>
      <rect x="40" y="364" width="644" height="246" rx="14" fill="#0C1322" stroke="#1C2536"/>
      <rect x="40" y="364" width="4" height="246" rx="2" fill="#00D9FF" fill-opacity="0.6"/>
      <g fill="none" stroke="#00D9FF" stroke-opacity="0.85">
        <circle cx="95" cy="412" r="7" fill="#00D9FF" stroke="none"/>
        <ellipse cx="95" cy="412" rx="24" ry="10" transform="rotate(-24 95 412)" stroke-width="1.6"/>
        <ellipse cx="95" cy="412" rx="24" ry="10" transform="rotate(56 95 412)" stroke-width="1.6"/>
      </g>
      <text x="136" y="424" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#E8EDF5">AI &amp; Automation</text>
      <g font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="17" fill="#8B96A9">
        <circle cx="88" cy="464" r="3" fill="#00D9FF"/><text x="106" y="470">n8n workflow orchestration</text>
        <circle cx="88" cy="500" r="3" fill="#00D9FF"/><text x="106" y="506">LLM-powered autonomous agents · Hermes</text>
        <circle cx="88" cy="536" r="3" fill="#00D9FF"/><text x="106" y="542">API orchestration across services</text>
        <circle cx="88" cy="572" r="3" fill="#00D9FF"/><text x="106" y="578">Business-process automation, humans in control</text>
      </g>
    </g>

    <!-- ============ Q4 · PRODUCTION ARCHITECTURE ============ -->
    <g>
      <rect x="716" y="364" width="644" height="246" rx="14" fill="#0C1322" stroke="#1C2536"/>
      <rect x="716" y="364" width="4" height="246" rx="2" fill="#7C5CFF" fill-opacity="0.6"/>
      <g stroke="#7C5CFF" stroke-width="2" fill="none" stroke-opacity="0.85">
        <path d="M 774 400 L 792 410 L 774 420 L 756 410 Z"/>
        <path d="M 756 420 L 774 430 L 792 420"/>
        <path d="M 756 430 L 774 440 L 792 430"/>
      </g>
      <text x="812" y="424" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#E8EDF5">Production Architecture</text>
      <g font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="17" fill="#8B96A9">
        <circle cx="764" cy="464" r="3" fill="#7C5CFF"/><text x="782" y="470">REST API design &amp; versioning</text>
        <circle cx="764" cy="500" r="3" fill="#7C5CFF"/><text x="782" y="506">MongoDB indexing &amp; parallel aggregations</text>
        <circle cx="764" cy="536" r="3" fill="#7C5CFF"/><text x="782" y="542">CI/CD pipelines with GitHub Actions</text>
        <circle cx="764" cy="572" r="3" fill="#7C5CFF"/><text x="782" y="578">Built for failure — retries, recovery, observability</text>
      </g>
    </g>

    <!-- scan sweep -->
    <rect x="-260" y="0" width="240" height="640" fill="url(#cpScan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1680 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="1399" height="639" rx="16" fill="none" stroke="#1C2536"/>
  </g>
</svg>
