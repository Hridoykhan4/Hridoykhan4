<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="cpTitle cpDesc">
  <title id="cpTitle">What I Deliver — System Capabilities</title>
  <desc id="cpDesc">Secure authentication: JWT flows with Firebase Auth, OAuth 2.0 with Google and Facebook, role-based access control, roles verified server-side. Payment systems: Stripe PaymentIntents live in production, SSLCommerz for local Bangladesh payments, prices recalculated server-side, webhook handling with retry and recovery. AI and automation: n8n workflow orchestration, LLM-powered autonomous agents including Hermes, API orchestration across services, process automation with humans in control. Production architecture: REST API design and versioning, MongoDB indexing and parallel aggregations, CI/CD pipelines with GitHub Actions, built for failure with retries and observability.</desc>

  <defs>
    <!-- aurora light sources -->
    <radialGradient id="auCy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auVi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auBl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cpDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#7FA3C9" fill-opacity="0.075"/>
    </pattern>

    <!-- glass card body + gradient rim -->
    <linearGradient id="cardFillCy" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#193049" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#0C1422" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#080C15" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardFillVi" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#26214A" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#0E1122" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#080C15" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="rimCy" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rimVi" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#A78BFA" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="topLite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FB4D8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8FB4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hdrRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipCy" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chipVi" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="cpGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cpHaloCy" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="16" flood-color="#22D3EE" flood-opacity="0.16"/>
    </filter>
    <filter id="cpHaloVi" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="16" flood-color="#A78BFA" flood-opacity="0.16"/>
    </filter>

    <clipPath id="cpClip"><rect x="0" y="0" width="1000" height="604" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#cpClip)">
    <!-- ── ground ── -->
    <rect width="1000" height="604" fill="#05080F"/>
    <ellipse cx="120" cy="40" rx="520" ry="330" fill="url(#auCy)"/>
    <ellipse cx="930" cy="600" rx="520" ry="340" fill="url(#auVi)"/>
    <ellipse cx="540" cy="300" rx="480" ry="260" fill="url(#auBl)"/>
    <rect width="1000" height="604" fill="url(#cpDots)"/>
    <rect x="0" y="0" width="1000" height="1.5" fill="url(#hdrRule)"/>

    <!-- ── header ── -->
    <g filter="url(#cpGlow)">
      <circle cx="42" cy="44" r="4.5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="60" y="51" font-family="'Cascadia Code','Consolas','SF Mono',Menlo,monospace" font-size="16" font-weight="700" letter-spacing="4.5" fill="#8FF3FF">WHAT I DELIVER<tspan fill="#3C4A63" font-weight="400">  //  SYSTEM CAPABILITIES</tspan></text>
    <text x="968" y="51" font-family="'Cascadia Code','Consolas','SF Mono',Menlo,monospace" font-size="11" letter-spacing="2.4" fill="#46587A" text-anchor="end">ENGINEERED FOR PRODUCTION</text>
    <rect x="32" y="72" width="936" height="1" fill="url(#hdrRule)"/>

    <!-- ═══ 01 · SECURE AUTHENTICATION ═══ -->
    <g>
      <rect x="32" y="100" width="464" height="232" rx="18" fill="url(#cardFillCy)" stroke="url(#rimCy)" stroke-width="1.2" filter="url(#cpHaloCy)"/>
      <rect x="76" y="100.6" width="376" height="1.2" fill="url(#topLite)"/>
      <path d="M 44 130 L 44 118 A 6 6 0 0 1 50 112 L 62 112" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 484 302 L 484 314 A 6 6 0 0 1 478 320 L 466 320" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="476" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#22D3EE" fill-opacity="0.055" text-anchor="end">01</text>

      <rect x="58" y="126" width="46" height="46" rx="14" fill="url(#chipCy)" stroke="#22D3EE" stroke-opacity="0.38"/>
      <g filter="url(#cpGlow)">
        <g stroke="#5FEFFF" stroke-width="1.9" fill="none" stroke-linecap="round">
          <rect x="71" y="148" width="20" height="14" rx="3.5"/>
          <path d="M 75.5 148 V 142 a 5.5 5.5 0 0 1 11 0 V 148"/>
        </g>
        <circle cx="81" cy="154.5" r="2" fill="#5FEFFF"/>
      </g>

      <text x="120" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Secure Authentication</text>
      <text x="120" y="168" font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#22D3EE" fill-opacity="0.6">IDENTITY · ACCESS · TRUST</text>
      <rect x="58" y="192" width="412" height="1" fill="url(#divFade)"/>

      <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#AEBCD2">
        <circle cx="66" cy="215" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="82" y="220">JWT flows + Firebase Auth</text>
        <circle cx="66" cy="245" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="82" y="250">OAuth 2.0 — Google &amp; Facebook</text>
        <circle cx="66" cy="275" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="82" y="280">Role-based access control (RBAC)</text>
        <circle cx="66" cy="305" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="82" y="310">Roles verified server-side, never from tokens</text>
      </g>
    </g>

    <!-- ═══ 02 · PAYMENT SYSTEMS ═══ -->
    <g>
      <rect x="504" y="100" width="464" height="232" rx="18" fill="url(#cardFillVi)" stroke="url(#rimVi)" stroke-width="1.2" filter="url(#cpHaloVi)"/>
      <rect x="548" y="100.6" width="376" height="1.2" fill="url(#topLite)"/>
      <path d="M 516 130 L 516 118 A 6 6 0 0 1 522 112 L 534 112" fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 956 302 L 956 314 A 6 6 0 0 1 950 320 L 938 320" fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="948" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#A78BFA" fill-opacity="0.055" text-anchor="end">02</text>

      <rect x="530" y="126" width="46" height="46" rx="14" fill="url(#chipVi)" stroke="#A78BFA" stroke-opacity="0.38"/>
      <g filter="url(#cpGlow)">
        <g stroke="#C9B6FF" stroke-width="1.9" fill="none" stroke-linecap="round">
          <rect x="541" y="140" width="24" height="17" rx="3.5"/>
          <line x1="541" y1="145.5" x2="565" y2="145.5"/>
        </g>
        <rect x="545" y="150" width="8" height="2.6" rx="1.3" fill="#C9B6FF"/>
      </g>

      <text x="592" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Payment Systems</text>
      <text x="592" y="168" font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#A78BFA" fill-opacity="0.6">CHECKOUT · WEBHOOKS</text>
      <rect x="530" y="192" width="412" height="1" fill="url(#divFade)"/>

      <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#AEBCD2">
        <circle cx="538" cy="215" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="554" y="220">Stripe PaymentIntents — live in production</text>
        <circle cx="538" cy="245" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="554" y="250">SSLCommerz for local BD payments</text>
        <circle cx="538" cy="275" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="554" y="280">Prices recalculated server-side</text>
        <circle cx="538" cy="305" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="554" y="310">Webhook handling with retry &amp; recovery</text>
      </g>
    </g>

    <!-- ═══ 03 · AI &amp; AUTOMATION ═══ -->
    <g>
      <rect x="32" y="352" width="464" height="232" rx="18" fill="url(#cardFillVi)" stroke="url(#rimVi)" stroke-width="1.2" filter="url(#cpHaloVi)"/>
      <rect x="76" y="352.6" width="376" height="1.2" fill="url(#topLite)"/>
      <path d="M 44 382 L 44 370 A 6 6 0 0 1 50 364 L 62 364" fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 484 554 L 484 566 A 6 6 0 0 1 478 572 L 466 572" fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="476" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#A78BFA" fill-opacity="0.055" text-anchor="end">03</text>

      <rect x="58" y="378" width="46" height="46" rx="14" fill="url(#chipVi)" stroke="#A78BFA" stroke-opacity="0.38"/>
      <g filter="url(#cpGlow)">
        <g fill="none" stroke="#C9B6FF" stroke-width="1.5">
          <ellipse cx="81" cy="401" rx="12.5" ry="5" transform="rotate(-28 81 401)"/>
          <ellipse cx="81" cy="401" rx="12.5" ry="5" transform="rotate(52 81 401)"/>
        </g>
        <circle cx="81" cy="401" r="3.4" fill="#C9B6FF"/>
      </g>

      <text x="120" y="400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">AI &amp; Automation</text>
      <text x="120" y="420" font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#A78BFA" fill-opacity="0.6">AGENTS · WORKFLOWS</text>
      <rect x="58" y="444" width="412" height="1" fill="url(#divFade)"/>

      <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#AEBCD2">
        <circle cx="66" cy="467" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="82" y="472">n8n workflow orchestration</text>
        <circle cx="66" cy="497" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="82" y="502">LLM-powered autonomous agents — Hermes</text>
        <circle cx="66" cy="527" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="82" y="532">API orchestration across services</text>
        <circle cx="66" cy="557" r="2.6" fill="#A78BFA" filter="url(#cpGlow)"/><text x="82" y="562">Process automation, humans stay in control</text>
      </g>
    </g>

    <!-- ═══ 04 · PRODUCTION ARCHITECTURE ═══ -->
    <g>
      <rect x="504" y="352" width="464" height="232" rx="18" fill="url(#cardFillCy)" stroke="url(#rimCy)" stroke-width="1.2" filter="url(#cpHaloCy)"/>
      <rect x="548" y="352.6" width="376" height="1.2" fill="url(#topLite)"/>
      <path d="M 516 382 L 516 370 A 6 6 0 0 1 522 364 L 534 364" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 956 554 L 956 566 A 6 6 0 0 1 950 572 L 938 572" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="948" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#22D3EE" fill-opacity="0.055" text-anchor="end">04</text>

      <rect x="530" y="378" width="46" height="46" rx="14" fill="url(#chipCy)" stroke="#22D3EE" stroke-opacity="0.38"/>
      <g filter="url(#cpGlow)">
        <g stroke="#5FEFFF" stroke-width="1.8" fill="none" stroke-linejoin="round">
          <path d="M 553 392 L 565 399 L 553 406 L 541 399 Z"/>
          <path d="M 541 404 L 553 411 L 565 404"/>
        </g>
      </g>

      <text x="592" y="400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Production Architecture</text>
      <text x="592" y="420" font-family="'Cascadia Code','Consolas',Menlo,monospace" font-size="10" letter-spacing="2.6" fill="#22D3EE" fill-opacity="0.6">APIS · DATA · CI/CD</text>
      <rect x="530" y="444" width="412" height="1" fill="url(#divFade)"/>

      <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#AEBCD2">
        <circle cx="538" cy="467" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="554" y="472">REST API design &amp; versioning</text>
        <circle cx="538" cy="497" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="554" y="502">MongoDB indexing &amp; parallel aggregations</text>
        <circle cx="538" cy="527" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="554" y="532">CI/CD pipelines with GitHub Actions</text>
        <circle cx="538" cy="557" r="2.6" fill="#22D3EE" filter="url(#cpGlow)"/><text x="554" y="562">Built for failure — retries &amp; observability</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="999" height="603" rx="20" fill="none" stroke="#1B2740"/>
  </g>
</svg>
